name: Nauty word refinement probe

on:
  pull_request:
    paths:
      - 'research/nauty_word_refinement_probe.jl'
      - '.github/workflows/NautyWordRefinement.yml'
      - 'src/directed_*.jl'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - name: Format research probe
        run: julia -e 'using Pkg; Pkg.add(name="JuliaFormatter"); using JuliaFormatter; format_file("research/nauty_word_refinement_probe.jl")'
      - name: Apply formatter to research branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet -- research/nauty_word_refinement_probe.jl; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/research/nauty_word_refinement_probe.jl?ref=${HEAD_REF}" --jq .sha)
            content=$(base64 -w0 research/nauty_word_refinement_probe.jl)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/research/nauty_word_refinement_probe.jl" \
              -f message='style: format word refinement probe' \
              -f content="$content" \
              -f sha="$sha" \
              -f branch="$HEAD_REF"
          fi
      - name: Instantiate research environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(name="BenchmarkTools", version="1")'
      - name: Run exactness and performance probe
        run: |
          set -o pipefail
          julia --project=. research/nauty_word_refinement_probe.jl | tee /tmp/word-refinement-probe.txt
      - name: Publish probe result
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/word-refinement-probe.txt
