name: Nauty compact packed workspace probe

on:
  pull_request:
    paths:
      - 'research/nauty_compact_packed_probe.jl'
      - '.github/workflows/NautyCompactPackedProbe.yml'
      - 'src/directed_*.jl'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Instantiate research environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(name="BenchmarkTools", version="1")'
      - name: Run compact workspace probe
        run: |
          set -o pipefail
          julia --project=. research/nauty_compact_packed_probe.jl | tee /tmp/compact-packed-probe.txt
      - name: Publish probe result
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/compact-packed-probe.txt
