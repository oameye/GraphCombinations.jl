name: KC one-word Nauty comparison

on:
  workflow_dispatch:
  push:
    branches:
      - research-kc-oneword-nauty-comparison
    paths:
      - research/kc_oneword_nauty_comparison.jl
      - .github/workflows/KCOneWordNautyComparison.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10.12'
      - uses: julia-actions/cache@v3
      - name: Create benchmark environment
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate("benchmark-nauty")
            Pkg.develop(path=".")
            Pkg.add(PackageSpec(name="NautyGraphs", version="0.7.3"))
            Pkg.instantiate()
          '
      - name: Compare exact GC candidate with released Nauty
        run: julia --project=benchmark-nauty --color=yes research/kc_oneword_nauty_comparison.jl
