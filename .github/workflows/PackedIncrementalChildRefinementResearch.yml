name: Packed incremental child refinement research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research/packed_incremental_child_refinement.jl
      - research/packed_incremental_child_refinement_research.jl
      - .github/workflows/PackedIncrementalChildRefinementResearch.yml
  push:
    branches:
      - research-packed-incremental-child-refinement
    paths:
      - research/packed_incremental_child_refinement.jl
      - research/packed_incremental_child_refinement_research.jl
      - .github/workflows/PackedIncrementalChildRefinementResearch.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
      - uses: julia-actions/cache@v3
      - name: Instantiate package
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Certify and benchmark incremental child refinement
        run: julia --project --color=yes research/packed_incremental_child_refinement_research.jl
