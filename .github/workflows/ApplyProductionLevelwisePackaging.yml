name: Apply production levelwise packaging

on:
  workflow_dispatch:
  push:
    branches:
      - production-kc-oneword-levelwise
    paths:
      - .github/workflows/ApplyProductionLevelwisePackaging.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-kc-oneword-levelwise
      - name: Remove research include chaining
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              "src/directed_levelwise/packed_levelwise_workspace.jl": 'include(joinpath(@__DIR__, "packed_incremental_refinement_trace.jl"))\n\n',
              "src/directed_levelwise/packed_levelwise_frontier_orbits.jl": 'include(joinpath(@__DIR__, "packed_levelwise_workspace.jl"))\n\n',
              "src/directed_levelwise/packed_incremental_child_refinement.jl": 'include(joinpath(@__DIR__, "packed_levelwise_frontier_orbits.jl"))\n\n',
          }
          for name, prefix in expected.items():
              path = Path(name)
              text = path.read_text()
              if not text.startswith(prefix):
                  raise SystemExit(f"unexpected production include prefix: {name}")
              path.write_text(text[len(prefix):])
          PY
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Format complete stacked tree
        shell: bash
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            format(".")
          '
      - name: Commit packaging and formatter checkpoint
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: freeze production levelwise packaging"
          git push origin HEAD:production-kc-oneword-levelwise
