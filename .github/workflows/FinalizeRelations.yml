name: finalize-relations

on:
  push:
    branches:
      - production-native-directed-relations
    paths:
      - .github/workflows/FinalizeRelations.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-native-directed-relations
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Harden checked relation storage arithmetic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/directed_relations.jl')
          s = p.read_text()
          marker = '# --- Native colored directed relational canonicalization ---\n\n'
          helper = '''# --- Native colored directed relational canonicalization ---\n\n@inline function _directed_relation_storage_size(\n    num_vertices::Int, num_relations::Int\n)::Int\n    square = Base.Checked.checked_mul(num_vertices, num_vertices)\n    return Base.Checked.checked_mul(square, num_relations)\nend\n\n'''
          assert marker in s
          s = s.replace(marker, helper, 1)
          s = s.replace('Base.Checked.checked_mul(n * n, nr)', '_directed_relation_storage_size(n, nr)')
          s = s.replace('Base.Checked.checked_mul(num_vertices * num_vertices, num_relations)', '_directed_relation_storage_size(num_vertices, num_relations)')
          s = s.replace('active = nr * n * n', 'active = _directed_relation_storage_size(n, nr)')
          s = s.replace('length(buffer.canonical_multiplicities) >= nr * n * n', 'length(buffer.canonical_multiplicities) >= _directed_relation_storage_size(n, nr)')
          p.write_text(s)
          PY
      - name: Apply JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter"))'
          julia -e 'using JuliaFormatter; format(".", verbose=true)'
      - name: Commit final source formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test research .github/workflows/DirectedRelationProductionBenchmark.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style: finalize native relation tranche'
            git push origin HEAD:production-native-directed-relations
          fi
