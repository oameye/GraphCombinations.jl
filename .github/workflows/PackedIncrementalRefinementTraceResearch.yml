name: Packed incremental refinement trace research

on:
  workflow_dispatch:
  push:
    branches:
      - research-packed-incremental-refinement-trace
    paths:
      - research/packed_incremental_refinement_trace.jl
      - research/packed_incremental_refinement_trace_certification.jl
      - .github/workflows/PackedIncrementalRefinementTraceResearch.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: lts
          arch: x64

      - uses: julia-actions/cache@v3

      - name: Instantiate package
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate()'

      - name: Certify exact refinement-event trace invariance
        run: julia --project --color=yes research/packed_incremental_refinement_trace_certification.jl
