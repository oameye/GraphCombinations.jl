name: Restore production research base

on:
  push:
    branches:
      - production-kc-oneword-levelwise
    paths:
      - .github/workflows/RestoreProductionResearchBase.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-kc-oneword-levelwise
          fetch-depth: 0
      - name: Restore inherited research tree from exact PR base
        shell: bash
        run: |
          git checkout efa49195c9fe2896e6c5d88b3b4ea3706a7edc83 -- research
          git diff --check
      - name: Commit minimal production diff
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research
          git commit -m "chore: keep production PR free of research formatting churn"
          git push origin HEAD:production-kc-oneword-levelwise
