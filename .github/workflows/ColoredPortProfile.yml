name: Colored Port Profile

on:
  push:
    branches:
      - 'research/weighted-colored-port-generation'
    paths:
      - '.github/workflows/ColoredPortProfile.yml'
      - 'src/colored_port_generation.jl'
      - 'research/colored_port_profile.jl'
      - 'research/colored_port_hybrid_profile.jl'
      - 'research/colored_port_symmetry_scaling.jl'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - name: Instantiate benchmark environment
        run: |
          julia --project=benchmarks -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Profile colored port quotienting
        run: |
          julia --project=benchmarks research/colored_port_hybrid_profile.jl | tee colored-port-profile.txt
      - name: Profile symmetry scaling
        run: |
          julia --project=benchmarks research/colored_port_symmetry_scaling.jl | tee colored-port-symmetry-scaling.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: colored-port-profile
          path: |
            colored-port-profile.txt
            colored-port-symmetry-scaling.txt
