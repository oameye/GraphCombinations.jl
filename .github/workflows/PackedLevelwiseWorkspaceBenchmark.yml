name: Packed levelwise workspace benchmark

on:
  push:
    branches:
      - research-packed-levelwise-workspace
    paths:
      - 'research/packed_levelwise_workspace.jl'
      - 'research/packed_levelwise_workspace_benchmark.jl'
      - 'research/packed_recursive_stabilizer_orbits.jl'
      - 'research/packed_incremental_refinement_trace.jl'
      - '.github/workflows/PackedLevelwiseWorkspaceBenchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
      - uses: julia-actions/cache@v3
      - name: Instantiate package
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Benchmark exact kernels
        run: julia --project --color=yes research/packed_levelwise_workspace_benchmark.jl
