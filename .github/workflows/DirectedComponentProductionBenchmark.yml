name: Directed component production benchmark

on:
  push:
    branches:
      - production-directed-component-decomposition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Instantiate package
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Run complete component benchmark
        run: |
          set -o pipefail
          julia --project=. --color=yes research/production_component_benchmark.jl \
            | tee directed-component-production-benchmark.txt
