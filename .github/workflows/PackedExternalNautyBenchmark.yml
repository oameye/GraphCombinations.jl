name: Packed external Nauty benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - research-packed-external-nauty-benchmark
    paths:
      - research/packed_external_nauty_benchmark.jl
      - research/packed_external_nauty_v073_driver.jl
      - .github/workflows/PackedExternalNautyBenchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
      - name: Benchmark against released NautyGraphs 0.7.3
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.develop(path=".")
            Pkg.add(PackageSpec(name="NautyGraphs", version="0.7.3"))
            Pkg.add("Graphs")
            Pkg.status()
            include("research/packed_external_nauty_v073_driver.jl")
          '
