name: Apply Colored Port Sort Optimization

on:
  push:
    branches:
      - 'research/weighted-colored-port-generation'
    paths:
      - '.github/workflows/ApplyColoredPortSortOptimization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/weighted-colored-port-generation
      - name: Apply exact measured optimization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/colored_port_generation.jl')
          text = path.read_text()
          old = '''function _write_mapped_port_edges!(
              destination::Vector{_PortEdge}, state::_PortMatchingState, mapping::Vector{Int}
          )::Nothing
              @inbounds for i in eachindex(state.edges)
                  edge = state.edges[i]
                  destination[i] = _PortEdge(
                      mapping[edge.source], mapping[edge.target], edge.source_color, edge.target_color
                  )
              end
              sort!(destination)
              return nothing
          end
          '''
          new = '''@inline function _insertion_sort_port_edges!(edges::Vector{_PortEdge})::Nothing
              @inbounds for i in 2:length(edges)
                  value = edges[i]
                  j = i - 1
                  while j >= 1 && isless(value, edges[j])
                      edges[j + 1] = edges[j]
                      j -= 1
                  end
                  edges[j + 1] = value
              end
              return nothing
          end

          function _write_mapped_port_edges!(
              destination::Vector{_PortEdge}, state::_PortMatchingState, mapping::Vector{Int}
          )::Nothing
              @inbounds for i in eachindex(state.edges)
                  edge = state.edges[i]
                  destination[i] = _PortEdge(
                      mapping[edge.source], mapping[edge.target], edge.source_color, edge.target_color
                  )
              end
              _insertion_sort_port_edges!(destination)
              return nothing
          end
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- src/colored_port_generation.jl
      - name: Commit optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/colored_port_generation.jl
          git commit -m 'perf: avoid mapped-edge sort allocations'
          git push origin HEAD:research/weighted-colored-port-generation
