name: Packed portfolio selector research

on:
  push:
    branches:
      - research-packed-portfolio-selector
    paths:
      - 'research/packed_portfolio_selector_diagnostics.jl'
      - 'research/packed_portfolio_trace_prefix.jl'
      - '.github/workflows/PackedPortfolioSelectorResearch.yml'
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
      - uses: julia-actions/cache@v3
      - name: Instantiate package
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Measure root/child selector diagnostics
        run: julia --project --color=yes research/packed_portfolio_selector_diagnostics.jl
      - name: Measure invariant trace-prefix selector
        run: julia --project --color=yes research/packed_portfolio_trace_prefix.jl
