name: Packed levelwise trace search research

on:
  workflow_dispatch:
  push:
    branches:
      - research-packed-levelwise-trace-search
    paths:
      - research/packed_levelwise_trace_search.jl
      - research/packed_levelwise_trace_search_certification.jl
      - research/packed_levelwise_trace_search_benchmark.jl
      - .github/workflows/PackedLevelwiseTraceSearchResearch.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: lts
          arch: x64

      - uses: julia-actions/cache@v3

      - name: Instantiate package
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate()'

      - name: Certify trace-defined canonical form
        run: julia --project --color=yes research/packed_levelwise_trace_search_certification.jl

      - name: Measure search-space contraction
        run: julia --project --color=yes research/packed_levelwise_trace_search_benchmark.jl
