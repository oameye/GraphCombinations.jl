name: Packed levelwise workspace research

on:
  workflow_dispatch:
  push:
    branches:
      - research-packed-levelwise-workspace
    paths:
      - research/packed_levelwise_workspace.jl
      - research/packed_levelwise_workspace_certification.jl
      - .github/workflows/PackedLevelwiseWorkspaceResearch.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: lts
          arch: x64

      - uses: julia-actions/cache@v3

      - name: Instantiate package
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate()'

      - name: Certify exact reusable levelwise workspace
        run: julia --project --color=yes research/packed_levelwise_workspace_certification.jl
