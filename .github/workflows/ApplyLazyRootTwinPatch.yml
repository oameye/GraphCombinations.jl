name: Apply lazy root twin patch

on:
  push:
    branches:
      - research-packed-root-orbit-pruning
    paths:
      - .github/workflows/ApplyLazyRootTwinPatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-packed-root-orbit-pruning
          fetch-depth: 0

      - name: Apply exact lazy root-twin patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/directed_packed_workspace.jl")
          text = path.read_text()

          old_function = '''function _packed_directed_seed_root_twins!(
              packed::PackedDirectedCanonicalizationWorkspace,
              graph::DirectedGCGraph,
              target_mask::UInt64,
          )::Nothing
              members = target_mask
              @inbounds while !iszero(members)
                  left = trailing_zeros(members) + 1
                  later = members & ~_packed_directed_vertex_bit(left)
                  while !iszero(later)
                      right = trailing_zeros(later) + 1
                      if _directed_workspace_exact_twins(graph, left, right)
                          _packed_directed_orbit_union!(packed, left, right)
                      end
                      later &= later - UInt64(1)
                  end
                  members &= members - UInt64(1)
              end
              return nothing
          end
          '''

          new_function = '''function _packed_directed_seed_chosen_root_twins!(
              packed::PackedDirectedCanonicalizationWorkspace,
              graph::DirectedGCGraph,
              chosen_vertex::Int,
              target_mask::UInt64,
          )::Nothing
              members = target_mask
              @inbounds while !iszero(members)
                  candidate = trailing_zeros(members) + 1
                  members &= members - UInt64(1)
                  candidate > chosen_vertex || continue
                  if _directed_workspace_exact_twins(graph, chosen_vertex, candidate)
                      _packed_directed_orbit_union!(packed, chosen_vertex, candidate)
                  end
              end
              return nothing
          end
          '''

          old_seed = '''    packed.root_orbit_active = true
              _packed_directed_seed_root_twins!(packed, graph, target_mask)

              @inbounds for chosen_vertex in 1:n
          '''
          new_seed = '''    packed.root_orbit_active = true

              @inbounds for chosen_vertex in 1:n
          '''

          insertion = '''        packed.root_current_vertex = chosen_vertex
              packed.root_branch_order = 0
          '''
          replacement = '''        _packed_directed_seed_chosen_root_twins!(
                  packed, graph, chosen_vertex, target_mask
              )
              packed.root_current_vertex = chosen_vertex
              packed.root_branch_order = 0
          '''

          for old, new, label in (
              (old_function, new_function, "root twin helper"),
              (old_seed, new_seed, "eager root twin seed"),
              (insertion, replacement, "lazy root twin insertion"),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label} replacement, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/directed_packed_workspace.jl
          git commit -m "perf: seed root exact twins lazily"
          git push origin HEAD:research-packed-root-orbit-pruning
