name: format-patch

on:
  push:
    branches:
      - production-native-directed-relations

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - uses: actions/checkout@v7
      - name: Generate JuliaFormatter patch
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter"))'
          julia -e 'using JuliaFormatter; format(".", verbose=true)'
          git diff --binary > /tmp/juliaformatter.patch
      - uses: actions/upload-artifact@v6
        with:
          name: juliaformatter-patch
          path: /tmp/juliaformatter.patch
