name: Directed relations research

on:
  push:
    branches:
      - research-native-directed-relations
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Instantiate package
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Run native relation certification
        run: |
          set -o pipefail
          julia --project=. --color=yes research/native_directed_relations.jl \
            | tee native-directed-relations.txt
      - uses: actions/upload-artifact@v6
        with:
          name: native-directed-relations
          path: native-directed-relations.txt
