name: Packed levelwise experimental paths research

on:
  workflow_dispatch:
  push:
    branches:
      - research-packed-levelwise-experimental-paths
    paths:
      - research/packed_levelwise_experimental_paths.jl
      - research/packed_levelwise_experimental_paths_research.jl
      - .github/workflows/PackedLevelwiseExperimentalPathsResearch.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: lts
          arch: x64

      - uses: julia-actions/cache@v3

      - name: Instantiate package
        run: julia --project --color=yes -e 'using Pkg; Pkg.instantiate()'

      - name: Certify and measure experimental-path quotient
        run: julia --project --color=yes research/packed_levelwise_experimental_paths_research.jl
